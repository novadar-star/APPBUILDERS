name: snapfood
description: An offline-first Filipino dorm cooking prototype.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 14.5.0
  camera: 0.11.0+2
  image_picker: 1.1.2
  shared_preferences: 2.5.3
  path_provider: 2.1.4
  google_fonts: ^6.2.1
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5


flutter:
  uses-material-design: true
  assets:
    - assets/data/ingredients.json
    - assets/data/recipes.json
    - assets/data/prices.json
    - assets/config/app_config.json
    - assets/models/
